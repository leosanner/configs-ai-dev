name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: lint
        run: make lint
        continue-on-error: false

      - name: typecheck
        run: make typecheck

      - name: test
        run: make test

      - name: secret-scan
        run: make secret-scan

      - name: Upload test results
        if: always() && hashFiles('.reports/test-results.xml') != '' || hashFiles('.reports/test-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            .reports/test-results.xml
            .reports/test-results.json
          if-no-files-found: ignore

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-${{ github.sha }}
          path: .reports/gitleaks.json
          if-no-files-found: ignore
